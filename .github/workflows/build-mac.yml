# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
name: Build Img2tim with CMake MacOS Intel and ARM

on:
  push:
    branches: ["main", test/build]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-13]
        build_type: [Release]
        c_compiler: [clang]
        include:
          - os: macos-latest
            artifact: macos-arm.tar.xz
          - os: macos-13
            artifact: macos-intel.tar.xz

    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/release" >> "$GITHUB_OUTPUT"

      - name: Download Ninja
        id: dl-ninja
        shell: bash
        run: brew update && brew install ninja

      - name: Install Freeimage
        id: dl-freimage
        shell: bash
        run: brew install freeimage

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -G Ninja
          -S ${{ github.workspace }}

      - name: Build
        id: build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Install Strip
        run: |
          cmake --install ${{ steps.strings.outputs.build-output-dir }} --prefix instdir --strip
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -E copy ${{ steps.strings.outputs.build-output-dir }}/../vendor/freeimage/FreeImage.dll instdir
          fi

      - name: Pack
        working-directory: instdir/bin
        shell: bash
        run: cmake -E tar cJfv ../../${{ matrix.artifact }} .

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          path: ${{ matrix.artifact }}
          name: ${{ matrix.artifact }}
